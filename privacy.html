<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Política de Privacidad — GoalUX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>Política de Privacidad — GoalUX</h1>
    <p class="sub">Versión 1.0 · Vigente desde el 30 de mayo de 2026</p>
  </header>

  <nav class="langs">
    <a href="#es">Español (vinculante)</a>
    <a href="#en">English</a>
  </nav>

  <section class="doc" id="es">
    <h2>Español</h2>
    <pre id="body-es">Cargando…</pre>
  </section>

  <section class="doc" id="en">
    <h2>English</h2>
    <pre id="body-en">Loading…</pre>
  </section>

  <footer>
    <a href="index.html">← GoalUX</a> · <a href="terms.html">Términos y Condiciones</a>
  </footer>
</div>
<script>
  // Fuente única: este HTML solo muestra lo que ya vive en privacy_es.txt /
  // privacy_en.txt. Editar el texto legal significa editar SOLO esos .txt
  // (los mismos que consume la app) — esta página se actualiza sola.
  function loadDoc(file, elementId) {
    fetch(file, { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (text) {
        document.getElementById(elementId).textContent = text;
      })
      .catch(function () {
        document.getElementById(elementId).textContent =
          'No se pudo cargar el documento. Intenta recargar la página.';
      });
  }
  loadDoc('privacy_es.txt', 'body-es');
  loadDoc('privacy_en.txt', 'body-en');
</script>
</body>
</html>
